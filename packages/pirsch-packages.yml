generated: '2026-08-13'
method: searched
source: >-
  https://docs.pirsch.io/api-sdks/sdks (the official SDK list), the
  github.com/pirsch-analytics organization repository listing, and the
  unauthenticated registry metadata endpoints registry.npmjs.org,
  proxy.golang.org and repo.packagist.org. Versions and publish dates below were
  read from those registry endpoints on 2026-08-13, not from prose.
docs: https://docs.pirsch.io/api-sdks/sdks
notes: >-
  Pirsch names exactly three officially supported client SDKs — JavaScript, Go
  and PHP. The docs page states plainly that community .NET and Ruby SDKs exist
  but "Unofficial SDKs are not supported by us", so those are not recorded here.
  The Java SDK repo in the same org has had no commit since 2022-05-31 and is
  published to no registry; it is recorded as unmaintained rather than dropped,
  because the repo is still public and discoverable.

packages:
