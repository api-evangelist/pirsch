    registry: npm
    name: pirsch-sdk
    url: https://www.npmjs.com/package/pirsch-sdk
    install: npm install pirsch-sdk
    repository: https://github.com/pirsch-analytics/pirsch-js-sdk
    official: true
    version: 2.10.1
    published: '2026-08-02'
    note: >-
      TypeScript/JavaScript client SDK for Pirsch. Most actively released of the
      three official SDKs.

  - language: go
    registry: go
    name: github.com/pirsch-analytics/pirsch-go-sdk/v2
