generated: '2026-08-13'
method: derived
status: candidate
first_party: false
source: >-
  Candidate tool list derived from the operations in
  openapi/_original/pirsch-pirsch-api-openapi.yml. Searched for a first-party
  Pirsch MCP server across docs.pirsch.io, the github.com/pirsch-analytics
  organization and the npm registry on 2026-08-13 and found none; the only
  Pirsch MCP server that exists is third-party (recorded below).

deployment:
  mode: none
  auth: none
  verified: searched
  note: >-
    Pirsch publishes no MCP server — neither a remote endpoint nor a stdio
    package. mcp.pirsch.io answers HTTP 200, but *.pirsch.io is a wildcard
    catch-all: that hostname and a control hostname return byte-identical
    2,817-byte SPA HTML, and a JSON-RPC tools/list POST to
    https://mcp.pirsch.io/mcp returns that same HTML, not an MCP response. It is
    not an endpoint. https://api.pirsch.io/mcp returns 404.

third_party_servers:
  - name: Pirsch Analytics MCP Server
    vendor: Very Good Plugins
    first_party: false
    mode: local-stdio
    install: npx @verygoodplugins/mcp-pirsch
    package: https://www.npmjs.com/package/@verygoodplugins/mcp-pirsch
    repository: https://github.com/verygoodplugins/mcp-pirsch
    auth: oauth
    auth_detail: >-
      Uses the caller's own Pirsch OAuth client credentials (client_id /
      client_secret) against POST /api/v1/token, with token caching and refresh.
    verified: searched
    source: https://github.com/verygoodplugins/mcp-pirsch
    tools: 17
    note: >-
      A real, installable MCP server, but it is a community project wrapping the
      public REST API. It is NOT a Pirsch agent surface and no MCPServer pointer
      is wired in apis.yml on the strength of it. Its tool names are mapped to
      the backing REST operations in pirsch-tool-crosswalk.yml.

