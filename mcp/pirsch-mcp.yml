authentication:
  scheme: http-bearer
  detail: authentication/pirsch-authentication.yml
  note: >-
    Any Pirsch MCP server must carry either an OAuth2 client-credentials token
    from POST /api/v1/token or a pa_-prefixed access key in the Authorization
    header. Access keys are write-only, so a read/statistics tool set requires
    the OAuth client type.
