source: >-
  Derived from the components.schemas $ref graph and the id-reference fields
  (domain_id, user_id, organization_id, funnel_id, webhook_id, theme_id) in
  openapi/_original/pirsch-pirsch-api-openapi.yml, cross-checked against the
  object shapes documented at https://docs.pirsch.io/api-sdks/api-v1.
docs: https://docs.pirsch.io/api-sdks/api-v1
notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field
  name; direction is from the entity that owns the reference.
id_scheme:
  format: opaque string identifiers
  prefixes: false
  note: >-
    Unlike prefix-typed APIs, Pirsch ids carry no type prefix — a domain id, a
    goal id and a member id are indistinguishable strings. The only typed
    identifier in the system is the pa_ access-key prefix, which is a
    credential, not an object id.

entities:
  - {name: User, domain: account, description: The authenticated account holder. Root of the ownership tree.}
  - {name: Organization, domain: account, description: Optional container that can own domains instead of a user.}
  - {name: Domain, domain: core, description: A tracked website. Every analytics object hangs off a domain.}
  - {name: AlternativeDomain, domain: core, description: An additional hostname reporting into the same domain.}
  - {name: Member, domain: access, description: A user's role (Owner/Admin/Viewer) on a domain or organization.}
  - {name: Invitation, domain: access, description: A pending email invitation to become a member.}
  - {name: AccessLink, domain: access, description: A shareable code granting read access to a dashboard, optionally time-limited.}
  - {name: Client, domain: access, description: An API client — either an OAuth client (client_id/client_secret) or a token client.}
  - {name: Hit, domain: collection, description: A single page view submitted to /hit. Write-only; not readable as an object.}
  - {name: Event, domain: collection, description: A named custom event with duration and a flat string metadata map.}
  - {name: Session, domain: collection, description: A visitor session, extended by /session keep-alive calls.}
  - {name: ConversionGoal, domain: analysis, description: A path pattern or event definition counted as a conversion.}
  - {name: Funnel, domain: analysis, description: An ordered list of filter steps measured as a drop-off sequence.}
  - {name: View, domain: analysis, description: A saved date range and period for a domain dashboard.}
  - {name: TrafficFilter, domain: analysis, description: A rule excluding traffic from a domain's statistics.}
  - {name: ShortLink, domain: engagement, description: A UTM-enriched short URL, optionally expiring and webhook-bound.}
  - {name: EmailReport, domain: engagement, description: A recurring emailed analytics digest on an interval.}
  - {name: Webhook, domain: engagement, description: An HTTPS endpoint POSTed to when a named custom event fires.}
  - {name: Statistics, domain: reporting, description: Read-only aggregate projections (TotalStats, VisitorStats, PageStats, ReferrerStats, PlatformStats, EventStats, ActiveVisitors).}

