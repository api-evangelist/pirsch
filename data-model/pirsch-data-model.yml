schema_inheritance:
  - {child: HitBatchRequest, parent: HitRequest, adds: [time]}
  - {child: EventRequest, parent: HitRequest, adds: [event_name, event_duration, event_meta, non_interactive]}
  - {child: EventBatchRequest, parent: EventRequest, adds: [time]}
  - {child: SessionBatchRequest, parent: SessionRequest, adds: [time]}
  - {child: UpdateGoalRequest, parent: CreateGoalRequest, adds: [id]}

roles:
  values: [Owner, Admin, Viewer]
  applies_to: [Domain.user_role, Member.role]
  note: >-
    UpdateMemberRequest only accepts Viewer or Admin — Owner cannot be granted
    through the API.

observations:
  - >-
    Domain is the hub of the entire model. Nineteen of the twenty entity types
    reach the domain in one hop; only User and Organization sit above it.
  - >-
    The foreign key naming is inconsistent between read and write. Statistics
    and several list operations scope by `id` (meaning domain id) while write
    operations use `domain_id`. An agent that assumes one name will fail on
    roughly half the surface.
  - >-
    Collection objects (Hit, Event, Session) are write-only. They can be
    submitted and then queried only as aggregates through /statistics/*; there
    is no GET for an individual hit or event.
