versioning:
  scheme: uri-path
  current: v1
  base: https://api.pirsch.io/api/v1
  docs: https://docs.pirsch.io/api-sdks/api-v1
  notes: >-
    The API version lives in the path. There is no version request header and no
    per-account pinning; every caller is on v1.

next_version:
  version: v2
  status: announced-not-released
  docs: https://docs.pirsch.io/api-sdks/api
  quote: >-
    "API version 2 is work and progess and will most likely be released at the
    end of 2026."
  notes: >-
    The v2 page exists at docs.pirsch.io/api-sdks/api and redirects readers back
    to v1. No v2 base URL, contract or migration guide is published. Note that
    the v2 page now occupies the /api-sdks/api and /api-sdks/api-guide URLs that
    previously served v1 — v1 moved to /api-sdks/api-v1 and
    /api-sdks/api-guide-v1. Any bookmark or catalog entry pointing at the old
    URLs silently lands on an unreleased API's placeholder.

deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  notes: >-
    Pirsch publishes no deprecation policy, no migration window and no RFC 8594
    Sunset/Deprecation header support. Deprecations, when they happen, appear in
    the changelog prose only. No `Deprecation` pointer is wired in apis.yml.

sla:
  url: null
  public_uptime_target: null
  notes: >-
    No uptime SLA is published on pirsch.io/terms or the pricing page. Enterprise
    terms are negotiated ("dedicated support" on the Enterprise tier) but no
    numeric commitment is public.

status_page: null
status_page_evidence:
  - url: https://status.pirsch.io
    status: 200
    verdict: not-a-status-page
    detail: >-
      *.pirsch.io is a wildcard catch-all. status.pirsch.io, mcp.pirsch.io and a
      control hostname all return a byte-identical 2,817-byte SPA shell
      (md5 4b8b7f1aabf34d4146694f566d6d87a8). The 200 is the wildcard, not a
      status page.
  - url: https://pirsch.io/status
    status: 404
notes_on_status: >-
  No status page was found. No `StatusPage` pointer is wired in apis.yml.
  Availability incidents are communicated via https://x.com/PirschAnalytics and
  the changelog.

